name: IncidentHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Backend Lint, Types & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Linter & Formatter Check
        run: |
          ruff check .
          ruff format --check .

      - name: MyPy Type Check
        run: |
          mypy app

      - name: Run Pytest
        run: |
          pytest

  frontend-quality:
    name: Frontend Lint, Types & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Prettier Format Check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Next.js Application
        run: npm run build
